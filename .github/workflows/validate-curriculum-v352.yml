name: Validate curriculum v3.5.2 regression contracts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run cross-document contract audit
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY' > curriculum-v352-validation.log 2>&1
          from pathlib import Path
          import re
          import subprocess

          c = Path('curriculum.md').read_text(encoding='utf-8')
          r = Path('README.md').read_text(encoding='utf-8')
          d = Path('docs/README.md').read_text(encoding='utf-8')
          p = Path('progress.md').read_text(encoding='utf-8')

          def check(name, condition, detail=''):
              if not condition:
                  raise AssertionError(f'{name}: {detail}')
              print(f'PASS: {name}')

          check('curriculum version header', c.startswith('# 2026 여름 픽앤플레이스 스터디\n## 최종 실행 커리큘럼 v3.5.2'))
          check('README version', '실행 커리큘럼 `v3.5.2` 확정' in r)
          check('progress version', '`curriculum.md` v3.5.2 문서 계약 확정' in p)
          check('revision history', '## v3.5.2 — 2026-07-27' in c)

          stale = [
              '다음 네 가지를 `docs/setup/week0_spike.md`에 고정한다',
              '이 네 값은 문서의 예시 이름보다',
              'actual joint position이 commanded close target 허용오차 안',
              '고정 bag으로 인식 개발을 계속하되 live sensor-to-action Gate는 미통과',
              'project world의 resolved 절대 경로를 공식 launch의 `world` argument로 전달',
              'Session 5부터 동작하는 `/simulation/reset_trial`, stamped `world_frame` initial pose',
          ]
          for phrase in stale:
              check(f'stale phrase removed: {phrase}', phrase not in c)

          required = {
              'reset_state_source': 12,
              'state_measured': 10,
              'TASK_CANCELED': 5,
              'final_gt_stamp_ns': 2,
              'final_gt_receive_seq': 3,
              'project_world_file': 5,
              'min_close_travel_m': 4,
              'gate_max_final_aperture_m': 4,
              'sensor_path_status=deferred': 4,
          }
          for token, minimum in required.items():
              count = c.count(token)
              check(f'token count {token}', count >= minimum, f'found {count}, need {minimum}')

          interfaces = [
              'RunTrial.action', 'PickPlace.action',
              'ResetTrial.srv', 'PrepareTransport.srv', 'ControlTransport.srv',
              'TaskStatus.msg', 'StageStatus.msg', 'ErrorCode.msg', 'TransportStatus.msg',
          ]
          for name in interfaces:
              check(f'interface {name}', name in c)

          error_match = re.search(r'# ErrorCode\.msg\n(.*?)uint16 value', c, re.S)
          check('ErrorCode block', error_match is not None)
          errors = re.findall(r'uint16\s+([A-Z0-9_]+)=(\d+)', error_match.group(1))
          check('TASK_CANCELED numeric registry', ('TASK_CANCELED', '403') in errors, str(errors))
          error_values = [int(v) for _, v in errors]
          check('ErrorCode values unique', len(error_values) == len(set(error_values)), str(errors))

          stage_match = re.search(r'# StageStatus\.msg\n(.*?)uint32 reached_mask', c, re.S)
          check('StageStatus block', stage_match is not None)
          stages = re.findall(r'uint32\s+([A-Z0-9_]+)=(\d+)', stage_match.group(1))
          stage_values = [int(v) for _, v in stages]
          check('StageStatus bit count', len(stages) == 7, str(stages))
          check('StageStatus values unique', len(stage_values) == len(set(stage_values)), str(stages))
          check('StageStatus values power-of-two', all(v > 0 and (v & (v - 1)) == 0 for v in stage_values), str(stages))

          required_phrases = [
              'reset_state_adapter.py', 'backend-private state query', 'bool state_measured',
              'reset_state_measured', '`reset_ok=true`는 `state_measured=true`',
              'state_measured = false', 'zero-stamp `world_frame` initial pose',
              'uint16 TASK_CANCELED=403', 'manual cancel은 `TASK_CANCELED`',
              'receive sequence가 snapshot보다 크고',
              'header.stamp`도 pre-terminal 최신 stamp보다 엄격히 새로우며',
              '늦게 도착한 pre-terminal sample',
              'final_gt_age_ms              # terminal→final GT steady receive gap; header age가 아님',
              'ROBOTIS `open_manipulator_x_gazebo.launch.py`는 이 값 뒤에 `.sdf`를 붙이므로',
              '공식 launch에는 마지막 `.sdf`를 제거한 `world` 값을 넘긴다',
              '정상 접촉이 있으면 joint가 그 target에 정확히 도달하지 않는 것이 자연스럽다',
              '구동이 수행됐다는 확인일 뿐 파지의 증거가 아님',
              '고정 bag은 개발용이며 최종 P2가 아님',
              'live source로 검증된** P2 fallback',
          ]
          for phrase in required_phrases:
              check(f'required phrase: {phrase}', phrase in c)

          check('final P2 phrase count', c.count('이는 최종 P2가 아니며') == 2, str(c.count('이는 최종 P2가 아니며')))
          for phrase in ['reset_state_source', 'extensionless official `world` argument', 'gripper close-travel/final-aperture envelope', 'S0-1 최초 작성 · S0-2 갱신']:
              check(f'docs phrase: {phrase}', phrase in d)
          check('README progress single source', '진행 기록의 단일 원본은 [progress.md](./progress.md)' in r)
          check('docs progress single source', '실제 진행 상황과 회차 로그의 단일 원본은 [`progress.md`](../progress.md)' in d)
          check('progress HTML scope', 'HTML/Pages 파일은 검토·수정 범위에서 제외' in p)

          changed = subprocess.check_output(['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True).splitlines()
          forbidden = [x for x in changed if x.endswith('.html') or x.startswith('assets/')]
          check('no HTML or assets changed', not forbidden, str(forbidden))

          for path in ['README.md', 'docs/README.md', 'progress.md']:
              text = Path(path).read_text(encoding='utf-8')
              for target in re.findall(r'\[[^\]]+\]\((?!https?://|#)([^)#]+)', text):
                  candidate = (Path(path).parent / target).resolve()
                  check(f'link resolves: {path} -> {target}', candidate.exists())

          print('curriculum v3.5.2 cross-document regression audit: PASS')
          PY
          status=$?
          cat curriculum-v352-validation.log
          exit "$status"

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-v352-validation-log
          path: curriculum-v352-validation.log

      - name: Markdown and whitespace sanity
        if: steps.audit.outcome == 'success'
        shell: bash
        run: |
          git diff --check origin/main...HEAD
          test "$(grep -c '^# 18. 개정 이력$' curriculum.md)" -eq 1
          test "$(grep -c '^## v3.5.2 — 2026-07-27$' curriculum.md)" -eq 1

      - name: Fail when contract audit failed
        if: steps.audit.outcome != 'success'
        run: exit 1
