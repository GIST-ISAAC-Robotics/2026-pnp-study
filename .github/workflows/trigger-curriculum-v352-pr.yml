name: Trigger curriculum v3.5.2 audit on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply embedded audit patch
        shell: bash
        run: |
          if grep -q '^## 최종 실행 커리큘럼 v3.5.2' curriculum.md; then
            echo 'Patch already applied.'
            exit 0
          fi
          rm -f .github/curriculum-v352-patch-error.log
          set +e
          python - <<'PY' > /tmp/curriculum-v352-patch.log 2>&1
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-curriculum-v352.yml').read_text(encoding='utf-8')
          marker_start = "          python - <<'PY'\n"
          marker_end = "\n          PY\n"
          body = workflow.split(marker_start, 1)[1].split(marker_end, 1)[0]
          body = body.replace(
              "              '- **grasp gate·aperture·joint target 임계값 YAML**',",
              "              '- [ ] **grasp gate·aperture·joint target 임계값 YAML**',",
          ).replace(
              "              '- **grasp gate·open aperture·`min_close_travel_m`·`gate_max_final_aperture_m` YAML**',",
              "              '- [ ] **grasp gate·open aperture·`min_close_travel_m`·`gate_max_final_aperture_m` YAML**',",
          )
          exec(compile(textwrap.dedent(body), 'embedded_curriculum_patch.py', 'exec'))
          PY
          status=$?
          set -e
          if test "$status" -ne 0; then
            cp /tmp/curriculum-v352-patch.log .github/curriculum-v352-patch-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/curriculum-v352-patch-error.log
            git commit -m "chore: record curriculum audit patch failure"
            git push origin HEAD:${{ github.head_ref }}
            cat /tmp/curriculum-v352-patch.log
            exit "$status"
          fi

      - name: Commit changes when present
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curriculum.md README.md docs/README.md progress.md .github/curriculum-v352-patch-error.log
          git commit -m "docs: fix curriculum v3.5.2 contract regressions"
          git push origin HEAD:${{ github.head_ref }}
