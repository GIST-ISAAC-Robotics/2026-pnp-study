              '`SetEntityPose` 단독 호출은 3번을 충족하지 않는다. `SetEntityState`가 실제 노출되면 pose+twist를 함께 설정하고, 그렇지 않으면 respawn 또는 custom reset system을 사용한다. 어느 경로든 reset 실패 시 `RunTrial`을 시작하지 않되, 해당 고정 scenario row를 삭제하거나 대체하지 않는다. `trial_started = false`, `run_trial_result_received = false`, `trial_completed = false`, `pipeline_success = false`, `grasp_plausible_success = false`, `place_success = NA`, 최종 `success = false`, `error_code = RESET_FAILED`와 position·orientation·속도 측정값을 기록하며, 도달하지 않은 downstream metric은 `NA`로 두고 평가 분모에 포함한다.',
              '`SetEntityPose` 단독 호출은 3번을 충족하지 않는다. `SetEntityState`가 실제 노출되면 pose+twist를 함께 설정하고, 그렇지 않으면 respawn 또는 custom reset system을 사용한다. 어느 명령 경로든 성공 boolean을 검증값으로 간주하지 않고 `reset_state_source`로 actual pose·twist를 읽는다. reset 실패 시 `RunTrial`을 시작하지 않되, 해당 고정 scenario row를 삭제하거나 대체하지 않는다. `trial_started = false`, `run_trial_result_received = false`, `trial_completed = false`, `pipeline_success = false`, `grasp_plausible_success = false`, `place_success = NA`, 최종 `success = false`, `error_code = RESET_FAILED`를 기록한다. `state_measured=true`면 position·orientation·속도 측정값을 보존하고, false면 네 값은 `NA`로 두며, 도달하지 않은 downstream metric도 `NA`로 두고 평가 분모에 포함한다.',
              'Session11 reset failure semantics',
          )

          c = once(
              c,
              'reset_ok\nreset_position_error_mm',
              'reset_ok\nreset_state_measured\nreset_position_error_mm',
              'CSV reset state field',
          )
          c = once(
              c,
              'final_gt_age_ms              # terminal→final GT steady receive gap\ncleanup_ok',
              'final_gt_stamp_ns             # accepted post-terminal GT source stamp\nfinal_gt_receive_seq          # evaluator-local receive sequence\nfinal_gt_age_ms              # terminal→final GT steady receive gap; header age가 아님\ncleanup_ok',
              'CSV final GT audit fields',
          )
          c = once(
              c,
              '9. full-scope action terminal 뒤이고 `evaluation_final_gt_max_age_s` 이내인 final GT를 자기 stamp의 `planning_frame`으로 변환해 scoring-only `place_target_pose`와의 `place_error_mm`를 계산하고 `error <= threshold`만으로 place success 판정. `place_ok`는 별도 stage 지표로 유지',
              '9. full-scope action terminal+cleanup 시 `terminal_gt_receive_seq`와 최신 GT stamp를 snapshot하고, receive sequence와 header stamp가 모두 그 경계보다 새로우며 `evaluation_final_gt_max_age_s` 이내인 final GT만 자기 stamp의 `planning_frame`으로 변환한다. `final_gt_stamp_ns`·`final_gt_receive_seq`·steady gap을 기록하고 scoring-only `place_target_pose`와의 `place_error_mm`를 계산해 `error <= threshold`만으로 place success 판정. `place_ok`는 별도 stage 지표로 유지',
              'Session11 final GT implementation',
          )
          c = once(
              c,
              '6. final GT가 action terminal·cleanup 뒤에 새로 수신됐고 다음 reset 전이며 terminal→receive steady gap이 `evaluation_final_gt_max_age_s` 이내인지, scoring-only target·threshold가 실행 때와 같은 `config_hash`인지 확인',
              '6. final GT의 evaluator receive sequence와 `header.stamp`가 terminal snapshot보다 모두 새롭고 다음 reset 전이며 terminal→receive steady gap이 `evaluation_final_gt_max_age_s` 이내인지 확인. 늦게 도착한 pre-terminal sample이나 sim stamp가 멈춘 sample을 재사용하지 않았는지, scoring-only target·threshold가 실행 때와 같은 `config_hash`인지 확인',
              'diagnostic final GT checks',
          )

          c = once(
              c,
              '- [ ] Session 5부터 동작하는 `/simulation/reset_trial`, stamped `world_frame` initial pose, finite unit quaternion, position·orientation·twist settle threshold와 CSV 전파; backend·네 threshold·quaternion tolerance는 `config_hash`에 포함',
              '- [ ] Session 5부터 동작하는 `/simulation/reset_trial`, zero-stamp `world_frame` initial pose, finite unit quaternion, 상태 변경용 `reset_backend`와 actual pose·twist 측정용 `reset_state_source`, `state_measured`, position·orientation·twist settle threshold와 CSV 전파; 두 경로·네 threshold·quaternion tolerance는 `config_hash`에 포함',
              'checklist reset contract',
          )
          c = once(
              c,
              '- [ ] project world argument와 Gazebo resource export 확인',
              '- [ ] `project_world_file` 실제 `.sdf` 경로, 공식 launch의 extensionless `world` argument와 Gazebo resource export 확인',
              'checklist world contract',
          )
          c = once(
              c,
              '- [ ] action cancel',
              '- [ ] action cancel: manual confirmed cancel은 `TASK_CANCELED`, timeout-induced cancel은 initiating code 유지',
              'checklist cancel contract',
          )
          c = once(
              c,
              '- [ ] `RunTrial` result와 조건부 terminal `TransportStatus`는 `run_id`로, GT/perception `PoseStamped`는 active attempt time window·timestamp로 연결',
              '- [ ] `RunTrial` result와 조건부 terminal `TransportStatus`는 `run_id`로, GT/perception `PoseStamped`는 active attempt time window·timestamp로 연결. final GT는 terminal snapshot보다 receive sequence와 header stamp가 모두 새로워야 함',
              'checklist final GT contract',
          )

          c = once(
              c,
              '# 18. 개정 이력\n\n## v3.5.1 — 2026-07-27',
              '# 18. 개정 이력\n\n## v3.5.2 — 2026-07-27\n\n- reset 명령 경로 `reset_backend`와 actual pose·twist 측정 경로 `reset_state_source`를 분리하고 `ResetTrial.state_measured`·NaN/CSV NA 계약을 추가\n- gripper close exact-target 조건을 제거하고 close travel·final aperture의 구동 envelope로 교정해 정상 접촉 파지를 거부할 수 있는 모순을 해소\n- ROBOTIS Gazebo launch가 `.sdf`를 붙이는 실제 동작에 맞춰 `project_world_file`과 extensionless `world` argument를 분리\n- final GT가 terminal 뒤 늦게 도착한 과거 sample을 재사용하지 않도록 receive sequence와 source stamp의 이중 신선도 경계를 추가\n- 고정 bag을 개발 전용 deferred 경로로 명시하고 최종 P2·Week 3 Gate와 분리\n- manual confirmed cancel의 canonical `TASK_CANCELED` 코드와 reset·final-GT audit CSV 필드를 추가\n- README·progress·docs 경로표까지 v3.5.2 기록 계약으로 동기화\n\n## v3.5.1 — 2026-07-27',
              'revision history v3.5.2',
          )

          # Static contract checks before saving.
          assert c.startswith('# 2026 여름 픽앤플레이스 스터디\n## 최종 실행 커리큘럼 v3.5.2')
          for token in [
              'reset_state_source', 'bool state_measured', 'reset_state_measured',
              'uint16 TASK_CANCELED=403', 'final_gt_stamp_ns', 'final_gt_receive_seq',
              'project_world_file', 'gate_max_final_aperture_m', 'sensor_path_status=deferred',
          ]:
              assert token in c, token
          assert 'actual joint position이 commanded close target 허용오차 안' not in c
          assert '고정 bag은 개발용이며 최종 P2가 아님' in c

          # ErrorCode numeric values must remain unique.
          block = re.search(r'# ErrorCode\.msg\n(.*?)uint16 value', c, re.S).group(1)
          pairs = re.findall(r'uint16\s+([A-Z0-9_]+)=(\d+)', block)
          values = [int(v) for _, v in pairs]
          assert len(values) == len(set(values)), pairs

          # Stage bits must remain unique powers of two.
          stage = re.search(r'# StageStatus\.msg\n(.*?)uint32 reached_mask', c, re.S).group(1)
          bits = [int(v) for _, v in re.findall(r'uint32\s+([A-Z0-9_]+)=(\d+)', stage)]
          assert len(bits) == len(set(bits))
          assert all(v > 0 and (v & (v - 1)) == 0 for v in bits)

          save('curriculum.md', c)

          r = load('README.md')
          r = once(r, '실행 커리큘럼 `v3.5.1` 확정', '실행 커리큘럼 `v3.5.2` 확정', 'README version')
          save('README.md', r)

          d = load('docs/README.md')
          d = once(
              d,
              '| `docs/setup/docker.md` | S0-1 | Docker image tag 또는 digest, ROBOTIS package commit, WSL/GPU/GUI 조건, 설치·실행·종료 명령, smoke test 결과 |',
              '| `docs/setup/docker.md` | S0-1 최초 작성 · S0-2 갱신 | Docker image tag 또는 digest, ROBOTIS package commit, WSL/GPU/GUI 조건, 설치·실행·종료 명령; S0-2에서 공식 Gazebo·MoveIt smoke test 결과 추가 |',
              'docs docker lifecycle',
          )
          d = once(
              d,
              '| `docs/setup/week0_spike.md` | S0-2~S0-3 | `ik_mode`와 status, `planning_frame`, `reset_backend`, RGB-depth registration/frame, T1/T0 spike 결과, 관련 config hash와 측정 로그 링크 |',
              '| `docs/setup/week0_spike.md` | S0-2~S0-3 | `ik_mode`와 status, `planning_frame`, 상태 변경용 `reset_backend`, actual pose·twist 측정용 `reset_state_source`, `state_measured`, RGB-depth registration/frame과 `sensor_path_status`, T1/T0 spike 결과, 관련 config hash와 측정 로그 링크 |',
              'docs week0 reset fields',
          )
          d = once(
              d,
              '| `docs/world_layout.md` | S5 | table/cube/camera 위치와 치수, model/object ID, frame 이름, 조명, reset initial pose와 position/orientation/속도 threshold, PosePublisher와 GT bridge 설정, `surface_to_center_offset_source`와 P2 `tag_to_object_center_offset_tag`, 고정 yaw·canonical object orientation, place threshold 계산 입력 |',
              '| `docs/world_layout.md` | S5 | table/cube/camera 위치와 치수, model/object ID, frame 이름, 조명, `project_world_file`과 extensionless official `world` argument, reset initial pose·`reset_state_source`·position/orientation/속도 threshold, PosePublisher와 GT bridge 설정, `surface_to_center_offset_source`와 P2 `tag_to_object_center_offset_tag`, 고정 yaw·canonical object orientation, gripper close-travel/final-aperture envelope, place threshold 계산 입력 |',
              'docs world contract fields',
          )
          save('docs/README.md', d)

          p = load('progress.md')
          p = once(
              p,
              '`curriculum.md` v3.5.1 문서 계약 확정',
              '`curriculum.md` v3.5.2 문서 계약 확정',
              'progress current version',
          )
          p = once(
              p,
              '- [ ] `docs/setup/docker.md`에 S0-1 환경과 smoke test 기록',
              '- [ ] `docs/setup/docker.md`에 S0-1 환경 기록; S0-2 종료 시 공식 smoke test 결과 추가',
              'progress docker timing',
          )
          p = once(
              p,
              '## 회차 로그\n\n### 2026-07-27 — 커리큘럼 v3.5.1 교차 계약 재검토',
              '## 회차 로그\n\n### 2026-07-27 — 커리큘럼 v3.5.2 전수 계약·저장소 회귀 검토\n\n- **상태:** 완료\n- **수행:** `curriculum.md` 처음부터 끝까지 producer/consumer, 상태기계, interface, reset·transport·평가 CSV와 README·`docs/README.md`·`progress.md` 기록 체계를 재검토\n- **결과:** reset 명령과 actual state 측정 경로를 분리하고 `state_measured`를 추가했다. gripper exact-close 모순, official world argument의 `.sdf` 중복 위험, terminal 뒤 지연 GT 재사용, fixed-bag의 최종 P2 오인, manual cancel code 누락을 교정했다. HTML/Pages 파일은 검토·수정 범위에서 제외했다.\n- **문제:** ROS 구현 전이므로 compile·Gazebo runtime 동작은 아직 검증하지 못함\n- **결정:** 실행 명세 v3.5.2를 Week 0 기준으로 사용. runtime에서 동결할 값은 `progress.md`와 지정 전문 문서에 증빙 링크와 함께 기록\n- **다음:** Session 0-1에서 Docker 환경 구축 시작\n- **증빙:** [curriculum.md](./curriculum.md), [README](./README.md), [문서 산출물 경로](./docs/README.md)\n\n### 2026-07-27 — 커리큘럼 v3.5.1 교차 계약 재검토',
              'progress v3.5.2 log',
          )
          save('progress.md', p)

          # Cross-file checks.
          assert 'v3.5.2' in load('README.md')
          assert 'v3.5.2' in load('progress.md')
          assert 'reset_state_source' in load('docs/README.md')
          assert 'HTML/Pages 파일은 검토·수정 범위에서 제외' in load('progress.md')
          PY

      - name: Validate diff and contract sentinels
        shell: bash
        run: |
          git diff --check
          test "$(grep -c '^## 최종 실행 커리큘럼 v3.5.2' curriculum.md)" -eq 1
          test "$(grep -c 'uint16 TASK_CANCELED=403' curriculum.md)" -eq 1
          test "$(grep -c 'bool state_measured' curriculum.md)" -eq 1
          ! grep -q 'commanded close target 허용오차 안' curriculum.md
          git diff --stat

      - name: Commit audited changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curriculum.md README.md docs/README.md progress.md
          git commit -m "docs: fix curriculum v3.5.2 contract regressions"
          git push origin HEAD:fix/curriculum-v3.5.2-audit
