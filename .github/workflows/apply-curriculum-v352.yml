name: Apply curriculum v3.5.2 audit patch

on:
  push:
    branches:
      - fix/curriculum-v3.5.2-audit
    paths:
      - .github/workflows/apply-curriculum-v352.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/curriculum-v3.5.2-audit
          fetch-depth: 0

      - name: Apply audited contract fixes
        shell: bash
        run: |
          python - <<'PY'
