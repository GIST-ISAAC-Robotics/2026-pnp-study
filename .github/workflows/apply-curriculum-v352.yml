          import re

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise AssertionError(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          def exact_count(text, old, new, expected, label):
              count = text.count(old)
              if count != expected:
                  raise AssertionError(f'{label}: expected {expected} occurrences, found {count}')
              return text.replace(old, new)

          c = load('curriculum.md')

          c = once(
              c,
              '## 최종 실행 커리큘럼 v3.5.1 — ROS 2 · Gazebo · MoveIt · RGB-D 통합',
